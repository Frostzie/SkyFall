[versions]
kotlin = "2.4.20"
fabric_kotlin = "1.14.1+kotlin.2.4.20"
fabric_loader = "0.19.5"
devauth = "1.2.2"
kotlinx-serialization = "1.11.0"

[libraries]
fabric_kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric_kotlin" }
fabric_loader = {module = "net.fabricmc:fabric-loader", version.ref = "fabric_loader"}
devauth = { module = "me.djtheredstoner:DevAuth-fabric", version.ref = "devauth" }
kotlinx_serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization"}

[plugins]
kotlin_jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin_serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"}
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }